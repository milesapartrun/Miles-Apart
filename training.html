<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training – Miles Apart Running Club</title>

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --turquoise: #18b8c7;
      --turquoise-light: #e4f8fb;
      --text: #111;
      --muted: #777;
      --border: #dedede;
      --soft: #f5f5f5;
      --danger: #b32632;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: var(--text);
    }

    /* =========================================================
       SIDEBAR
       ========================================================= */

    .brand {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      padding: 0;
      margin: 0;
    }

    .brand a {
      display: block;
      width: 100%;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 64px;
      row-gap: 28px;
      width: 100%;
      margin-top: 28px;
    }

    .nav a {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: 0 12px;
      border-radius: 999px;
      color: #5e6261;
      font-size: 25px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.025em;
      text-decoration: none;
      transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease;
      box-sizing: border-box;
    }

    .nav a:hover {
      color: #111;
      transform: translateY(-1px);
    }

    .nav a.active::before {
      content: none !important;
      display: none !important;
    }

    .nav a.active {
      background: #e4f8fb;
      color: #111;
      padding: 0 12px !important;
      font-weight: 800 !important;
    }

    .nav a.active .nav-active-dot {
      display: block !important;
      flex: 0 0 10px;
      width: 10px;
      height: 10px;
      margin-left: 24px;
      margin-right: 24px;
      border-radius: 50%;
      background: #18b8c7;
    }

    .nav a.active .nav-active-text {
      display: block;
      flex: 0 0 auto;
      color: #111;
      font-size: inherit;
      line-height: inherit;
      font-weight: 800 !important;
      letter-spacing: inherit;
    }

    /* =========================================================
       TRAINING PAGE
       ========================================================= */

    .training-page {
      width: 100%;
    }

    .training-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 42px;
    }

    .training-kicker {
      margin-bottom: 12px;
      color: #777;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .training-title {
      margin: 0;
      font-size: clamp(52px, 6vw, 88px);
      line-height: .95;
      letter-spacing: -.055em;
      font-weight: 900;
    }

    .training-subtitle {
      max-width: 650px;
      margin: 20px 0 0;
      color: #777;
      font-size: 24px;
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .add-training-btn {
      flex: 0 0 auto;
      min-height: 58px;
      padding: 0 28px;
      border: 1px solid #111;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
    }

    .add-training-btn:hover {
      background: var(--turquoise);
      border-color: var(--turquoise);
      transform: translateY(-1px);
    }

    /* =========================================================
       WEEK CONTROLS
       ========================================================= */

    .week-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .week-title-wrap {
      min-width: 0;
    }

    .week-label {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .week-range {
      margin-top: 5px;
      color: #777;
      font-size: 15px;
      font-weight: 600;
    }

    .week-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 44px;
      padding: 0 14px;
      border: 1px solid #d9d9d9;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition:
        border-color .18s ease,
        background .18s ease,
        color .18s ease;
    }

    .week-action:hover {
      border-color: #111;
      background: #111;
      color: #fff;
    }

    /* =========================================================
       WEEK GRID
       ========================================================= */

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 14px;
    }

    .day-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 460px;
      padding: 24px 18px 18px;
      border: 1px solid #dedede;
      border-radius: 24px;
      background: #fff;
      overflow: hidden;
      transition:
        border-color .18s ease,
        transform .18s ease;
    }

    .day-card:hover {
      transform: translateY(-1px);
    }

    .day-card.today {
      border-color: #18b8c7;
      box-shadow: inset 0 3px 0 #18b8c7;
    }

    .day-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .day-name {
      color: #6d6f70;
      font-size: 17px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .day-number {
      margin-top: 10px;
      font-size: 48px;
      line-height: .9;
      font-weight: 900;
      letter-spacing: -.045em;
    }

    .day-today {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 25px;
      padding: 0 9px;
      border-radius: 999px;
      background: #18b8c7;
      color: #fff;
      font-size: 11px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .day-content {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 35px 0 20px;
    }

    .empty-plus {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 126px;
      height: 126px;
      margin-bottom: 26px;
      border: 0;
      border-radius: 50%;
      background: #f2f2f2;
      color: #111;
      font-family: inherit;
      font-size: 52px;
      line-height: 1;
      font-weight: 300;
      cursor: pointer;
      transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease;
    }

    .empty-plus:hover {
      background: var(--turquoise);
      color: #fff;
      transform: scale(1.03);
    }

    .empty-message {
      max-width: 310px;
      color: #929292;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 500;
      letter-spacing: -.02em;
    }

    .day-add-btn {
      width: 100%;
      min-height: 58px;
      margin-top: auto;
      border: 1px solid #111;
      border-radius: 18px;
      background: #111;
      color: #fff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      transition:
        background .18s ease,
        border-color .18s ease;
    }

    .day-add-btn:hover {
      background: var(--turquoise);
      border-color: var(--turquoise);
    }

    /* =========================================================
       PLANNED RUN
       ========================================================= */

    .planned-run {
      width: 100%;
      padding: 16px;
      border-radius: 18px;
      background: #f6f6f6;
      text-align: left;
    }

    .run-type {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: #18b8c7;
      color: #fff;
      font-size: 11px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .run-distance {
      margin-top: 13px;
      font-size: 32px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .run-distance span {
      color: #777;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .run-pace {
      margin-top: 8px;
      color: #666;
      font-size: 15px;
      font-weight: 700;
    }

    .run-notes {
      margin-top: 12px;
      color: #444;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .edit-run-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border: 1px solid #d7d7d7;
      border-radius: 15px;
      background: #fff;
      color: #111;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition:
        background .18s ease,
        border-color .18s ease;
    }

    .edit-run-btn:hover {
      background: #111;
      border-color: #111;
      color: #fff;
    }

    /* =========================================================
       SUMMARY
       ========================================================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .summary-card {
      min-height: 150px;
      padding: 24px;
      border: 1px solid #dedede;
      border-radius: 24px;
      background: #fff;
    }

    .summary-label {
      color: #777;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .summary-value {
      margin-top: 18px;
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.045em;
    }

    .summary-value small {
      color: #777;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
    }

    /* =========================================================
       MODAL
       ========================================================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, .52);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .training-modal {
      position: relative;
      width: min(620px, 100%);
      max-height: min(900px, calc(100dvh - 48px));
      overflow-y: auto;
      padding: 34px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .2);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .modal-title {
      margin: 0;
      font-size: 36px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.045em;
    }

    .modal-date {
      margin-top: 10px;
      color: #888;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      border: 1px solid #dedede;
      border-radius: 50%;
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
      font-size: 31px;
      line-height: 1;
      font-weight: 300;
      cursor: pointer;
      transition:
        border-color .18s ease,
        background .18s ease;
    }

    .modal-close:hover {
      border-color: #111;
      background: #f4f4f4;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-label {
      display: block;
      margin-bottom: 10px;
      color: #363636;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      min-height: 64px;
      padding: 0 18px;
      border: 2px solid #d9d9d9;
      border-radius: 15px;
      outline: none;
      background: #fff;
      color: #222;
      font-family: inherit;
      font-size: 19px;
      font-weight: 500;
      transition:
        border-color .18s ease,
        box-shadow .18s ease;
    }

    select.form-control {
      appearance: auto;
      -webkit-appearance: auto;
      padding-right: 14px;
    }

    textarea.form-control {
      min-height: 170px;
      padding-top: 16px;
      padding-bottom: 16px;
      resize: vertical;
      line-height: 1.45;
    }

    .form-control:focus {
      border-color: #18b8c7;
      box-shadow: 0 0 0 2px rgba(24, 184, 199, .18);
    }

    /* Pace deliberately uses text input so values like 5:30 work. */
    #runPace {
      -webkit-appearance: none;
      appearance: none;
    }

    .modal-actions {
      display: grid;
      gap: 12px;
      margin-top: 30px;
    }

    .modal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 64px;
      padding: 0 20px;
      border: 2px solid #dcdcdc;
      border-radius: 15px;
      background: #fff;
      color: #111;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      transition:
        background .18s ease,
        border-color .18s ease,
        color .18s ease;
    }

    .modal-btn.primary {
      background: #18b8c7;
      border-color: #18b8c7;
      color: #fff;
    }

    .modal-btn.primary:hover {
      background: #111;
      border-color: #111;
    }

    .modal-btn.danger {
      color: #b32632;
    }

    .modal-btn.danger:hover {
      background: #b32632;
      border-color: #b32632;
      color: #fff;
    }

    .modal-btn.secondary {
      color: #3e83e8;
    }

    .modal-btn.secondary:hover {
      background: #3e83e8;
      border-color: #3e83e8;
      color: #fff;
    }

    /* =========================================================
       SIDEBAR WEEK PROGRESS
       ========================================================= */

    .sidebar-week {
      margin-top: 38px;
      padding: 20px;
      border-radius: 20px;
      background: #f5f5f5;
    }

    .sidebar-week-label {
      color: #777;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .sidebar-week-value {
      margin-top: 8px;
      font-size: 25px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.03em;
    }

    .sidebar-progress-track {
      width: 100%;
      height: 7px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: #ddd;
    }

    .sidebar-progress {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--turquoise);
      transition: width .25s ease;
    }

    .sidebar-week-text {
      margin-top: 9px;
      color: #777;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 600;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 1200px) {
      .week-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .training-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .add-training-btn {
        width: 100%;
      }

      .week-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .nav {
        column-gap: 18px;
        row-gap: 16px;
      }

      .nav a {
        min-height: 54px;
        font-size: 21px;
      }

      .nav a.active {
        padding: 0 8px !important;
      }

      .nav a.active .nav-active-dot {
        width: 9px;
        height: 9px;
        flex-basis: 9px;
        margin-left: 14px;
        margin-right: 18px;
      }

      .training-title {
        font-size: 58px;
      }

      .training-subtitle {
        font-size: 20px;
      }

      .week-grid {
        grid-template-columns: 1fr;
      }

      .day-card {
        min-height: 430px;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .brand {
        margin-bottom: 22px;
      }

      .nav {
        column-gap: 10px;
        row-gap: 12px;
      }

      .nav a {
        min-height: 48px;
        padding: 0 8px;
        font-size: 18px;
      }

      .nav a.active {
        padding: 0 4px !important;
      }

      .nav a.active .nav-active-dot {
        width: 8px;
        height: 8px;
        flex-basis: 8px;
        margin-left: 12px;
        margin-right: 14px;
      }

      .training-title {
        font-size: 50px;
      }

      .training-subtitle {
        font-size: 18px;
      }

      .training-header {
        margin-bottom: 30px;
      }

      .week-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .week-actions {
        width: 100%;
      }

      .week-action {
        flex: 1;
      }

      .training-modal {
        max-height: calc(100dvh - 24px);
        padding: 25px 20px;
        border-radius: 24px;
      }

      .modal-title {
        font-size: 31px;
      }

      .modal-close {
        width: 46px;
        height: 46px;
        font-size: 27px;
      }

      .form-control {
        min-height: 60px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       SIDEBAR
       ========================================================= -->

  <aside class="sidebar">

    <div class="brand">
      <a href="index.html">
        <img
          src="miles-apart-wordmark.png"
          alt="Miles Apart Running Club"
        >
      </a>
    </div>

    <nav class="nav">
      <a href="index.html">
        Miles Apart
      </a>

      <a href="home.html">
        Home
      </a>

      <a href="challenges.html">
        Challenges
      </a>

      <a href="community.html">
        Community
      </a>

      <a href="events.html">
        Events
      </a>

      <a href="training.html" class="active">
        <span class="nav-active-dot"></span>
        <span class="nav-active-text">Training</span>
      </a>
    </nav>

    <div class="sidebar-week">
      <div class="sidebar-week-label">Diese Woche</div>

      <div class="sidebar-week-value">
        <span id="sidebarWeekKm">0</span> km
      </div>

      <div class="sidebar-progress-track">
        <div
          class="sidebar-progress"
          id="sidebarProgress"
        ></div>
      </div>

      <div
        class="sidebar-week-text"
        id="sidebarWeekText"
      >
        0 von 30 km geplant
      </div>
    </div>

  </aside>


  <!-- =========================================================
       MAIN
       ========================================================= -->

  <main class="main">
    <div class="training-page">

      <div class="training-header">

        <div>
          <div class="training-kicker">
            Miles Apart / Training
          </div>

          <h1 class="training-title">
            Training.
          </h1>

          <p class="training-subtitle">
            Dein Laufplan. Deine Woche. Dein Rhythmus.
          </p>
        </div>

        <button
          type="button"
          class="add-training-btn"
          id="openAddRunBtn"
        >
          + Lauf planen
        </button>

      </div>


      <!-- =====================================================
           WEEK TOOLBAR
           ===================================================== -->

      <div class="week-toolbar">

        <div class="week-title-wrap">
          <div
            class="week-label"
            id="weekLabel"
          >
            Diese Woche
          </div>

          <div
            class="week-range"
            id="weekRange"
          >
            –
          </div>
        </div>

        <div class="week-actions">

          <button
            type="button"
            class="week-action"
            id="previousWeekBtn"
            aria-label="Vorherige Woche"
          >
            ←
          </button>

          <button
            type="button"
            class="week-action"
            id="todayWeekBtn"
          >
            Heute
          </button>

          <button
            type="button"
            class="week-action"
            id="nextWeekBtn"
            aria-label="Nächste Woche"
          >
            →
          </button>

        </div>

      </div>


      <!-- =====================================================
           DAYS
           ===================================================== -->

      <section
        class="week-grid"
        id="weekGrid"
        aria-label="Trainingswoche"
      ></section>


      <!-- =====================================================
           SUMMARY
           ===================================================== -->

      <section class="summary-grid">

        <div class="summary-card">
          <div class="summary-label">
            Wochenumfang
          </div>

          <div class="summary-value">
            <span id="summaryKm">0</span>
            <small>km</small>
          </div>
        </div>


        <div class="summary-card">
          <div class="summary-label">
            Läufe
          </div>

          <div class="summary-value">
            <span id="summaryRuns">0</span>
          </div>
        </div>


        <div class="summary-card">
          <div class="summary-label">
            Geplante Pace
          </div>

          <div class="summary-value">
            <span id="summaryPace">–</span>
            <small id="summaryPaceUnit"></small>
          </div>
        </div>

      </section>

    </div>
  </main>


  <!-- =========================================================
       RUN MODAL
       ========================================================= -->

  <div
    class="modal-backdrop"
    id="runModal"
    aria-hidden="true"
  >

    <div
      class="training-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <div class="modal-head">

        <div>
          <h2
            class="modal-title"
            id="modalTitle"
          >
            Lauf planen
          </h2>

          <div
            class="modal-date"
            id="modalDate"
          >
            –
          </div>
        </div>

        <button
          type="button"
          class="modal-close"
          id="closeModalBtn"
          aria-label="Schließen"
        >
          ×
        </button>

      </div>


      <!-- TAG -->

      <div class="form-group">

        <label
          class="form-label"
          for="runDay"
        >
          Tag
        </label>

        <select
          class="form-control"
          id="runDay"
        >
          <option value="1">Montag</option>
          <option value="2">Dienstag</option>
          <option value="3">Mittwoch</option>
          <option value="4">Donnerstag</option>
          <option value="5">Freitag</option>
          <option value="6">Samstag</option>
          <option value="0">Sonntag</option>
        </select>

      </div>


      <!-- LAUFART -->

      <div class="form-group">

        <label
          class="form-label"
          for="runType"
        >
          Laufart
        </label>

        <select
          class="form-control"
          id="runType"
        >
          <option value="Easy Run">Easy Run</option>
          <option value="Zone 2">Zone 2</option>
          <option value="Tempolauf">Tempolauf</option>
          <option value="Intervalle">Intervalle</option>
          <option value="Long Run">Long Run</option>
          <option value="Recovery Run">Recovery Run</option>
          <option value="Frei">Frei</option>
        </select>

      </div>


      <!-- DISTANZ -->

      <div class="form-group">

        <label
          class="form-label"
          for="runDistance"
        >
          Distanz
        </label>

        <input
          class="form-control"
          id="runDistance"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.1"
          placeholder="z. B. 10"
          autocomplete="off"
        >

      </div>


      <!-- PACE -->

      <div class="form-group">

        <label
          class="form-label"
          for="runPace"
        >
          Pace
        </label>

        <input
          class="form-control"
          id="runPace"
          type="text"
          inputmode="text"
          placeholder="z. B. 5:30"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >

      </div>


      <!-- NOTIZEN -->

      <div class="form-group">

        <label
          class="form-label"
          for="runNotes"
        >
          Notizen / Details
        </label>

        <textarea
          class="form-control"
          id="runNotes"
          placeholder="z. B. 6 × 1000 m, 2 min Trabpause"
        ></textarea>

      </div>


      <!-- ACTIONS -->

      <div class="modal-actions">

        <button
          type="button"
          class="modal-btn primary"
          id="saveRunBtn"
        >
          Lauf speichern
        </button>

        <button
          type="button"
          class="modal-btn danger"
          id="deleteRunBtn"
          style="display:none;"
        >
          Lauf löschen
        </button>

        <button
          type="button"
          class="modal-btn secondary"
          id="cancelRunBtn"
        >
          Abbrechen
        </button>

      </div>

    </div>

  </div>


  <script>
    /* =========================================================
       CONSTANTS
       ========================================================= */

    const STORAGE_KEY = "milesApartTrainingPlan";
    const WEEKLY_TARGET = 30;

    const DAY_NAMES = [
      "Sonntag",
      "Montag",
      "Dienstag",
      "Mittwoch",
      "Donnerstag",
      "Freitag",
      "Samstag"
    ];

    const DAY_SHORT = [
      "SO",
      "MO",
      "DI",
      "MI",
      "DO",
      "FR",
      "SA"
    ];


    /* =========================================================
       DOM
       ========================================================= */

    const weekGrid = document.getElementById("weekGrid");

    const weekLabel = document.getElementById("weekLabel");
    const weekRange = document.getElementById("weekRange");

    const previousWeekBtn =
      document.getElementById("previousWeekBtn");

    const todayWeekBtn =
      document.getElementById("todayWeekBtn");

    const nextWeekBtn =
      document.getElementById("nextWeekBtn");

    const openAddRunBtn =
      document.getElementById("openAddRunBtn");

    const runModal =
      document.getElementById("runModal");

    const closeModalBtn =
      document.getElementById("closeModalBtn");

    const cancelRunBtn =
      document.getElementById("cancelRunBtn");

    const saveRunBtn =
      document.getElementById("saveRunBtn");

    const deleteRunBtn =
      document.getElementById("deleteRunBtn");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalDate =
      document.getElementById("modalDate");

    const runDay =
      document.getElementById("runDay");

    const runType =
      document.getElementById("runType");

    const runDistance =
      document.getElementById("runDistance");

    const runPace =
      document.getElementById("runPace");

    const runNotes =
      document.getElementById("runNotes");

    const summaryKm =
      document.getElementById("summaryKm");

    const summaryRuns =
      document.getElementById("summaryRuns");

    const summaryPace =
      document.getElementById("summaryPace");

    const summaryPaceUnit =
      document.getElementById("summaryPaceUnit");

    const sidebarWeekKm =
      document.getElementById("sidebarWeekKm");

    const sidebarProgress =
      document.getElementById("sidebarProgress");

    const sidebarWeekText =
      document.getElementById("sidebarWeekText");


    /* =========================================================
       STATE
       ========================================================= */

    let currentWeekStart = startOfWeek(new Date());

    let editingDateKey = null;

    let trainingPlan = loadTrainingPlan();


    /* =========================================================
       DATE HELPERS
       ========================================================= */

    function startOfWeek(date) {
      const result = new Date(date);
      result.setHours(0, 0, 0, 0);

      const day = result.getDay();

      const diff = day === 0
        ? -6
        : 1 - day;

      result.setDate(result.getDate() + diff);

      return result;
    }


    function addDays(date, amount) {
      const result = new Date(date);
      result.setDate(result.getDate() + amount);
      return result;
    }


    function dateKey(date) {
      const year = date.getFullYear();

      const month = String(
        date.getMonth() + 1
      ).padStart(2, "0");

      const day = String(
        date.getDate()
      ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    function formatDate(date) {
      return date.toLocaleDateString(
        "de-DE",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      );
    }


    function formatShortDate(date) {
      return date.toLocaleDateString(
        "de-DE",
        {
          day: "2-digit",
          month: "2-digit"
        }
      );
    }


    function isSameDay(a, b) {
      return dateKey(a) === dateKey(b);
    }


    function getDayIndexFromMonday(date) {
      const day = date.getDay();

      return day === 0
        ? 6
        : day - 1;
    }


    /* =========================================================
       STORAGE
       ========================================================= */

    function loadTrainingPlan() {
      try {
        const saved =
          localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return {};
        }

        const parsed = JSON.parse(saved);

        if (
          parsed &&
          typeof parsed === "object"
        ) {
          return parsed;
        }

        return {};
      } catch (error) {
        console.error(
          "Trainingsplan konnte nicht geladen werden:",
          error
        );

        return {};
      }
    }


    function saveTrainingPlan() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(trainingPlan)
        );
      } catch (error) {
        console.error(
          "Trainingsplan konnte nicht gespeichert werden:",
          error
        );
      }
    }


    /* =========================================================
       HTML ESCAPE
       ========================================================= */

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================================
       PACE HELPERS
       ========================================================= */

    function normalizePace(value) {
      if (!value) {
        return "";
      }

      return String(value)
        .trim()
        .replace(",", ":");
    }


    function paceToSeconds(value) {
      const pace = normalizePace(value);

      if (!pace) {
        return null;
      }

      const match =
        pace.match(/^(\d{1,2})(?::(\d{1,2}))?$/);

      if (!match) {
        return null;
      }

      const minutes =
        Number(match[1]);

      const seconds =
        match[2] !== undefined
          ? Number(match[2])
          : 0;

      if (
        !Number.isFinite(minutes) ||
        !Number.isFinite(seconds) ||
        seconds >= 60
      ) {
        return null;
      }

      return (
        minutes * 60 +
        seconds
      );
    }


    function secondsToPace(seconds) {
      if (
        !Number.isFinite(seconds)
      ) {
        return "–";
      }

      const rounded =
        Math.round(seconds);

      const minutes =
        Math.floor(rounded / 60);

      const secs =
        rounded % 60;

      return (
        minutes +
        ":" +
        String(secs).padStart(2, "0")
      );
    }


    /* =========================================================
       WEEK RENDERING
       ========================================================= */

    function renderWeek() {
      renderWeekHeader();
      renderDays();
      renderSummary();
      renderSidebarProgress();
    }


    function renderWeekHeader() {
      const today =
        startOfWeek(new Date());

      const isCurrentWeek =
        dateKey(currentWeekStart) ===
        dateKey(today);

      weekLabel.textContent =
        isCurrentWeek
          ? "Diese Woche"
          : "Trainingswoche";

      const endOfWeek =
        addDays(currentWeekStart, 6);

      weekRange.textContent =
        `${formatShortDate(currentWeekStart)} – ${formatShortDate(endOfWeek)}`;
    }


    function renderDays() {
      weekGrid.innerHTML = "";

      const today = new Date();

      for (let i = 0; i < 7; i++) {
        const date =
          addDays(currentWeekStart, i);

        const key =
          dateKey(date);

        const run =
          trainingPlan[key] || null;

        const card =
          document.createElement("article");

        card.className =
          "day-card";

        if (isSameDay(date, today)) {
          card.classList.add("today");
        }

        const dayName =
          DAY_NAMES[date.getDay()];

        const dayShort =
          DAY_SHORT[date.getDay()];

        const todayBadge =
          isSameDay(date, today)
            ? `<span class="day-today">Heute</span>`
            : "";

        card.innerHTML = `
          <div class="day-top">

            <div>
              <div class="day-name">
                ${dayShort}
              </div>

              <div class="day-number">
                ${date.getDate()}
              </div>
            </div>

            ${todayBadge}

          </div>

          <div class="day-content">

            ${
              run
                ? renderPlannedRun(run, key)
                : renderEmptyDay(dayName, key)
            }

          </div>

          <button
            type="button"
            class="day-add-btn"
            data-action="add"
            data-date="${key}"
          >
            ${run ? "Lauf bearbeiten" : "+ Lauf hinzufügen"}
          </button>
        `;

        weekGrid.appendChild(card);
      }
    }


    function renderEmptyDay(dayName, key) {
      return `
        <button
          type="button"
          class="empty-plus"
          data-action="add"
          data-date="${key}"
          aria-label="Lauf für ${escapeHtml(dayName)} planen"
        >
          +
        </button>

        <div class="empty-message">
          Noch kein Lauf<br>
          für ${escapeHtml(dayName)} geplant.
        </div>
      `;
    }


    function renderPlannedRun(run, key) {
      const distance =
        run.distance !== ""
          ? escapeHtml(run.distance)
          : "–";

      const pace =
        run.pace
          ? escapeHtml(run.pace)
          : "";

      const notes =
        run.notes
          ? escapeHtml(run.notes)
          : "";

      return `
        <div class="planned-run">

          <div class="run-type">
            ${escapeHtml(run.type || "Lauf")}
          </div>

          <div class="run-distance">
            ${distance}
            <span>km</span>
          </div>

          ${
            pace
              ? `
                <div class="run-pace">
                  Pace ${pace} min/km
                </div>
              `
              : ""
          }

          ${
            notes
              ? `
                <div class="run-notes">
                  ${notes}
                </div>
              `
              : ""
          }

          <button
            type="button"
            class="edit-run-btn"
            data-action="edit"
            data-date="${key}"
          >
            Lauf bearbeiten
          </button>

        </div>
      `;
    }


    /* =========================================================
       SUMMARY
       ========================================================= */

    function getCurrentWeekRuns() {
      const runs = [];

      for (let i = 0; i < 7; i++) {
        const date =
          addDays(currentWeekStart, i);

        const key =
          dateKey(date);

        if (trainingPlan[key]) {
          runs.push(trainingPlan[key]);
        }
      }

      return runs;
    }


    function renderSummary() {
      const runs =
        getCurrentWeekRuns();

      let totalKm = 0;

      let paceSecondsTotal = 0;
      let paceCount = 0;

      runs.forEach(run => {
        const distance =
          Number(run.distance);

        if (
          Number.isFinite(distance) &&
          distance > 0
        ) {
          totalKm += distance;
        }

        const paceSeconds =
          paceToSeconds(run.pace);

        if (paceSeconds !== null) {
          paceSecondsTotal += paceSeconds;
          paceCount++;
        }
      });

      summaryKm.textContent =
        formatNumber(totalKm);

      summaryRuns.textContent =
        runs.length;

      if (paceCount > 0) {
        const averagePace =
          paceSecondsTotal / paceCount;

        summaryPace.textContent =
          secondsToPace(averagePace);

        summaryPaceUnit.textContent =
          " min/km";
      } else {
        summaryPace.textContent =
          "–";

        summaryPaceUnit.textContent =
          "";
      }
    }


    function renderSidebarProgress() {
      const runs =
        getCurrentWeekRuns();

      let totalKm = 0;

      runs.forEach(run => {
        const distance =
          Number(run.distance);

        if (
          Number.isFinite(distance) &&
          distance > 0
        ) {
          totalKm += distance;
        }
      });

      const percentage =
        Math.min(
          100,
          Math.max(
            0,
            (totalKm / WEEKLY_TARGET) * 100
          )
        );

      sidebarWeekKm.textContent =
        formatNumber(totalKm);

      sidebarProgress.style.width =
        `${percentage}%`;

      sidebarWeekText.textContent =
        `${formatNumber(totalKm)} von ${WEEKLY_TARGET} km geplant`;
    }


    function formatNumber(value) {
      if (
        Number.isInteger(value)
      ) {
        return String(value);
      }

      return value
        .toFixed(1)
        .replace(".", ",");
    }


    /* =========================================================
       MODAL
       ========================================================= */

    function openRunModal(date = null, mode = "add") {
      let targetDate;

      if (date) {
        targetDate =
          new Date(`${date}T12:00:00`);
      } else {
        targetDate =
          new Date();
      }

      const key =
        dateKey(targetDate);

      editingDateKey =
        mode === "edit"
          ? key
          : null;

      const existingRun =
        trainingPlan[key] || null;

      modalTitle.textContent =
        mode === "edit"
          ? "Lauf bearbeiten"
          : "Lauf planen";

      modalDate.textContent =
        `${DAY_NAMES[targetDate.getDay()]} · ${formatDate(targetDate)}`;

      /*
       * WICHTIG:
       * Der Tag wird immer gesetzt.
       *
       * Beim Klick auf "+ Lauf planen" oben:
       * -> heutiger/aktuell ausgewählter Tag
       *
       * Beim Klick auf das Plus eines Tages:
       * -> genau dieser Tag
       *
       * Der Nutzer kann danach den Tag im Select
       * trotzdem frei ändern.
       */
      runDay.value =
        String(targetDate.getDay());

      if (existingRun) {
        runType.value =
          existingRun.type || "Easy Run";

        runDistance.value =
          existingRun.distance ?? "";

        runPace.value =
          existingRun.pace ?? "";

        runNotes.value =
          existingRun.notes ?? "";

        deleteRunBtn.style.display =
          "flex";
      } else {
        runType.value =
          "Easy Run";

        runDistance.value =
          "";

        runPace.value =
          "";

        runNotes.value =
          "";

        deleteRunBtn.style.display =
          "none";
      }

      runModal.classList.add("open");
      runModal.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow =
        "hidden";

      /*
       * Auf Desktop direkt Tag fokussieren.
       * Auf Mobile lassen wir den Nutzer
       * zunächst das Formular sehen.
       */
      setTimeout(() => {
        if (window.innerWidth > 760) {
          runDay.focus();
        }
      }, 50);
    }


    function closeRunModal() {
      runModal.classList.remove("open");

      runModal.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow =
        "";

      editingDateKey = null;
    }


    /* =========================================================
       SELECTED DAY
       ========================================================= */

    function getSelectedDateKey() {
      const selectedDay =
        Number(runDay.value);

      /*
       * currentWeekStart ist Montag.
       *
       * Sonntag hat JS-Wert 0.
       * Montag 1 ... Samstag 6.
       */

      let offset;

      if (selectedDay === 0) {
        offset = 6;
      } else {
        offset = selectedDay - 1;
      }

      const selectedDate =
        addDays(
          currentWeekStart,
          offset
        );

      return dateKey(selectedDate);
    }


    function updateModalDateFromDay() {
      const key =
        getSelectedDateKey();

      const selectedDate =
        new Date(`${key}T12:00:00`);

      modalDate.textContent =
        `${DAY_NAMES[selectedDate.getDay()]} · ${formatDate(selectedDate)}`;
    }


    /* =========================================================
       SAVE
       ========================================================= */

    function saveRun() {
      const targetKey =
        getSelectedDateKey();

      /*
       * Wenn ein bestehender Lauf bearbeitet wird
       * und der Tag geändert wurde, entfernen wir
       * den alten Eintrag und legen ihn am neuen
       * Tag wieder an.
       */
      if (
        editingDateKey &&
        editingDateKey !== targetKey
      ) {
        delete trainingPlan[editingDateKey];
      }

      const distanceValue =
        runDistance.value.trim();

      const paceValue =
        normalizePace(
          runPace.value
        );

      const notesValue =
        runNotes.value.trim();

      const run = {
        type: runType.value,
        distance: distanceValue,
        pace: paceValue,
        notes: notesValue
      };

      trainingPlan[targetKey] =
        run;

      saveTrainingPlan();

      closeRunModal();

      renderWeek();
    }


    /* =========================================================
       DELETE
       ========================================================= */

    function deleteRun() {
      if (!editingDateKey) {
        return;
      }

      const confirmed =
        window.confirm(
          "Diesen Lauf wirklich löschen?"
        );

      if (!confirmed) {
        return;
      }

      delete trainingPlan[
        editingDateKey
      ];

      saveTrainingPlan();

      closeRunModal();

      renderWeek();
    }


    /* =========================================================
       EVENT DELEGATION – DAY CARDS
       ========================================================= */

    weekGrid.addEventListener(
      "click",
      function(event) {

        const button =
          event.target.closest(
            "[data-action]"
          );

        if (!button) {
          return;
        }

        const action =
          button.dataset.action;

        const date =
          button.dataset.date;

        if (
          action === "add"
        ) {
          openRunModal(
            date,
            "add"
          );
        }

        if (
          action === "edit"
        ) {
          openRunModal(
            date,
            "edit"
          );
        }
      }
    );


    /* =========================================================
       TOP ADD BUTTON
       ========================================================= */

    openAddRunBtn.addEventListener(
      "click",
      function() {

        /*
         * Oben "+ Lauf planen":
         * Wir öffnen das Formular mit dem
         * heutigen Tag innerhalb der aktuell
         * angezeigten Woche.
         *
         * Ist eine andere Woche geöffnet,
         * wird der Montag dieser Woche
         * vorausgewählt.
         *
         * Der Nutzer kann den Tag danach
         * über das neue TAG-Feld ändern.
         */

        const today =
          new Date();

        const todayWeek =
          startOfWeek(today);

        const currentWeekKey =
          dateKey(currentWeekStart);

        const todayWeekKey =
          dateKey(todayWeek);

        let defaultDate;

        if (
          currentWeekKey ===
          todayWeekKey
        ) {
          defaultDate =
            today;
        } else {
          defaultDate =
            currentWeekStart;
        }

        openRunModal(
          dateKey(defaultDate),
          "add"
        );
      }
    );


    /* =========================================================
       MODAL EVENTS
       ========================================================= */

    closeModalBtn.addEventListener(
      "click",
      closeRunModal
    );

    cancelRunBtn.addEventListener(
      "click",
      closeRunModal
    );

    saveRunBtn.addEventListener(
      "click",
      saveRun
    );

    deleteRunBtn.addEventListener(
      "click",
      deleteRun
    );


    /*
     * Wenn im Modal ein anderer Tag gewählt wird,
     * aktualisieren wir direkt das Datum oben.
     */
    runDay.addEventListener(
      "change",
      updateModalDateFromDay
    );


    /*
     * Klick auf den dunklen Bereich außerhalb
     * des Modals schließt das Fenster.
     */
    runModal.addEventListener(
      "click",
      function(event) {

        if (
          event.target === runModal
        ) {
          closeRunModal();
        }
      }
    );


    /*
     * ESC schließt das Fenster.
     */
    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          runModal.classList.contains("open")
        ) {
          closeRunModal();
        }
      }
    );


    /* =========================================================
       WEEK NAVIGATION
       ========================================================= */

    previousWeekBtn.addEventListener(
      "click",
      function() {

        currentWeekStart =
          addDays(
            currentWeekStart,
            -7
          );

        renderWeek();
      }
    );


    nextWeekBtn.addEventListener(
      "click",
      function() {

        currentWeekStart =
          addDays(
            currentWeekStart,
            7
          );

        renderWeek();
      }
    );


    todayWeekBtn.addEventListener(
      "click",
      function() {

        currentWeekStart =
          startOfWeek(
            new Date()
          );

        renderWeek();
      }
    );


    /* =========================================================
       INITIAL RENDER
       ========================================================= */

    renderWeek();

  </script>

</body>

</html>
